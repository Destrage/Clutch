[env]
# Bundled FFmpeg 9 (LGPL, shared). See third_party/ (git-ignored).
FFMPEG_DIR = { value = "third_party/ffmpeg", relative = true }
# Chromium Embedded Framework for the browser helper; downloaded here on first build.
CEF_PATH = { value = "third_party/cef", relative = true }
# Clang for bindgen: found in C:\Program Files\LLVM (Windows) or the system's llvm (Linux).
# Set LIBCLANG_PATH yourself if it lives somewhere else.

[target.'cfg(target_os = "linux")']
# Load the FFmpeg and CEF libraries copied next to the executable. An old-style RPATH (not
# RUNPATH) also applies to the libraries' own dependencies (libavdevice needs libavfilter).
rustflags = ["-C", "link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN"]

[alias]
xtask = "run --package xtask --"

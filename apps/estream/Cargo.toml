[package]
name = "estream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "eStream: a modern live streaming and recording studio"

[lints]
workspace = true

[dependencies]
estream-api.workspace = true
estream-automation.workspace = true
estream-clips.workspace = true
estream-montage.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
estream-health.workspace = true
estream-capture = { path = "../../crates/estream-capture" }
estream-core.workspace = true
estream-engine.workspace = true
estream-gpu.workspace = true
estream-media = { path = "../../crates/estream-media" }
estream-project.workspace = true
estream-vcam.workspace = true
anyhow.workspace = true
rfd.workspace = true
dirs.workspace = true
fastrand.workspace = true
getrandom = "0.3"
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
winresource = "0.1"

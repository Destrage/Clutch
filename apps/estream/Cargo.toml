[package]
name = "estream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clutch: a modern live streaming, recording and clipping studio"

[[bin]]
name = "clutch"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
estream-api.workspace = true
estream-automation.workspace = true
estream-clips.workspace = true
estream-montage.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
estream-health.workspace = true
estream-capture = { path = "../../crates/estream-capture" }
estream-core.workspace = true
estream-engine.workspace = true
estream-gpu.workspace = true
estream-media = { path = "../../crates/estream-media" }
estream-project.workspace = true
estream-vcam.workspace = true
anyhow.workspace = true
cosmic-text.workspace = true
image.workspace = true
rfd.workspace = true
dirs.workspace = true
fastrand.workspace = true
base64 = "0.23"
getrandom = "0.3"
glam.workspace = true
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
ureq = { version = "3.4", features = ["json"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
slint.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
trash = "5"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io"] }
pollster.workspace = true
keyring-core = "1.0.1"
ring = "0.17.14"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[build-dependencies]
slint-build.workspace = true
winresource = "0.1"

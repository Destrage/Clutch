[package]
name = "estream-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Macros, triggers and global hotkeys for eStream"

[lints]
workspace = true

[dependencies]
estream-api.workspace = true
estream-core.workspace = true
estream-engine.workspace = true
estream-project.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3.34"
pollster.workspace = true
x11rb = "0.13.2"

[dev-dependencies]
serde_json.workspace = true

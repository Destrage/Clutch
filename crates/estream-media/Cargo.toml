[package]
name = "estream-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "eStream encoding, muxing, recording and replay buffer (FFmpeg)"

[lints]
workspace = true

[dependencies]
estream-audio.workspace = true
estream-core.workspace = true
estream-engine.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
estream-vcam.workspace = true
ffmpeg-next.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = { version = "3.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

[dev-dependencies]
estream-gpu.workspace = true
estream-project.workspace = true
serde_json.workspace = true

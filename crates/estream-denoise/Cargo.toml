[package]
name = "estream-denoise"
version.workspace = true
# The vendored DeepFilterNet code is kept close to upstream, which is edition 2021.
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version.workspace = true
description = "Clutch strong noise suppression: DeepFilterNet3 (low latency) on tract"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
flate2 = "1.0.24"
ndarray = "0.17"
num-complex = "0.4"
realfft = "3.1"
rust-ini = "0.21"
tar = "0.4.38"
# Pinned exactly: tract changes its API between patch-level releases (see
# openspec/changes/add-strong-noise-suppression/design.md).
tract-core = "=0.23.9"
tract-hir = "=0.23.9"
tract-onnx = "=0.23.9"
tract-pulse = "=0.23.9"

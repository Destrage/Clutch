[package]
name = "estream-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "eStream capture and media sources (display, window, game, camera, image, text)"

[lints]
workspace = true

[dependencies]
estream-audio.workspace = true
estream-core.workspace = true
cosmic-text.workspace = true
image.workspace = true
estream-engine.workspace = true
estream-gpu.workspace = true
estream-shm.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
estream-project.workspace = true
pollster.workspace = true

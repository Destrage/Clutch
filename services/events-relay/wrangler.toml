name = "clutch-events-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served only on the project's own domain (the zone is on the same Cloudflare account): no
# workers.dev address and no preview addresses.
workers_dev = false
preview_urls = false
routes = [{ pattern = "events.destrosphere.com", custom_domain = true }]

# Clutch's Kick and Google apps (client IDs are public). Their secrets are Worker secrets:
#   npx wrangler secret put KICK_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
[vars]
GOOGLE_CLIENT_ID = "46556432306-3u7mt0aq1fratn3ht9o1tl0ui9reg49s.apps.googleusercontent.com"
KICK_CLIENT_ID = "01M5DQAWSH2G2VEC4ERGDHNJXY"

# Connection attempts to /kick/live per address: Clutch connects once and reconnects with growing
# pauses, so 10 a minute is plenty; beyond that the relay answers 429 at once.
[[ratelimits]]
name = "LIVE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Sign-in code and renewal swaps (/kick/token, /kick/refresh) per address.
[[ratelimits]]
name = "TOKEN_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]

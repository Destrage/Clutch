name = "clutch-events-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served only on the project's own domain (the zone is on the same Cloudflare account): no
# workers.dev address and no preview addresses.
workers_dev = false
preview_urls = false
routes = [{ pattern = "events.destrosphere.com", custom_domain = true }]

# Clutch's Kick app (public). Its secret is set with: npx wrangler secret put KICK_CLIENT_SECRET
[vars]
KICK_CLIENT_ID = "01M5DQAWSH2G2VEC4ERGDHNJXY"

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]

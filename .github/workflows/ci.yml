name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A fixed FFmpeg 9 build (BtbN keeps month-end builds; dailies vanish after two weeks).
  # Not "latest": BtbN builds from 2026-11-18 on crash in libkvazaar.
  FFMPEG_TAG: autobuild-2026-10-31-12-59
  FFMPEG_NAME: ffmpeg-n9.0.2-39-g7adfbe40dc

jobs:
  rust:
    # Windows first (primary platform); GPU tests fall back to the WARP software adapter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg 9 (LGPL, shared)
        shell: pwsh
        run: |
          curl.exe -sSL --fail -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_NAME-win64-lgpl-shared-9.0.zip"
          Expand-Archive ffmpeg.zip -DestinationPath third_party
          Move-Item "third_party/$env:FFMPEG_NAME-win64-lgpl-shared-9.0" third_party/ffmpeg
      # Some runner images point at a removed MSVC toolset (CMake then found cl.exe 14.52 but
      # link.exe 14.51, and the CEF build failed). Load the installed toolset's environment
      # so every later step uses one consistent compiler and linker.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $tools = ($vars | Where-Object { $_ -like 'VCToolsInstallDir=*' }) -replace '^VCToolsInstallDir=', ''
          if (-not (Test-Path (Join-Path $tools 'bin\Hostx64\x64\link.exe'))) { throw "no link.exe in $tools" }
          Write-Output "MSVC tools: $tools"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The cache holds CMake's setup of the CEF build, with the linker it found: a runner with
      # another MSVC toolset needs its own cache, or CMake keeps a linker that isn't there.
      - uses: Swatinem/rust-cache@v2
        with:
          key: msvc-${{ env.VCToolsVersion }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser test launches the helper binary, which `cargo test` doesn't build.
      - run: cargo build -p estream-browser
      # One test at a time: WARP renders on the runner's few cores, and engines rendering in
      # parallel starve each other's encoder feeds.
      - run: cargo test --workspace --exclude estream-media --no-fail-fast -- --test-threads=1
      # estream-media's integration tests record and stream in real time, which WARP can't keep
      # up with on this runner (a different few fail on each run). rust-linux runs them all.
      - run: cargo test -p estream-media --lib --no-fail-fast
      - name: Upload golden image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/output/

  rust-linux:
    # GPU tests run on Mesa's software Vulkan (lavapipe).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # No distro libav*-dev: its headers would shadow the bundled FFmpeg 9.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake ninja-build \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig-dev libssl-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev \
            mesa-vulkan-drivers
      - name: FFmpeg 9 (LGPL, shared)
        run: |
          mkdir -p third_party/ffmpeg
          curl -sSL --fail "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_NAME-linux64-lgpl-shared-9.0.tar.xz" \
            | tar -xJ -C third_party/ffmpeg --strip-components=1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser test launches the helper binary, which `cargo test` doesn't build.
      - run: cargo build -p estream-browser
      - run: cargo test --workspace --no-fail-fast

  appimage:
    # Built on the oldest supported Ubuntu (PipeWire 1.0, which the bindings need), so the
    # AppImage runs on any newer glibc (2.39+).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake ninja-build \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig-dev libssl-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev
      - name: FFmpeg 9 (LGPL, shared)
        run: |
          mkdir -p third_party/ffmpeg
          curl -sSL --fail "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_NAME-linux64-lgpl-shared-9.0.tar.xz" \
            | tar -xJ -C third_party/ffmpeg --strip-components=1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Platform app IDs (public by design, kept out of the repo): Music and Connect YouTube.
      - run: cargo xtask package
        env:
          CLUTCH_JAMENDO_CLIENT_ID: ${{ secrets.CLUTCH_JAMENDO_CLIENT_ID }}
          CLUTCH_YOUTUBE_CLIENT_ID: ${{ secrets.CLUTCH_YOUTUBE_CLIENT_ID }}
          CLUTCH_KICK_CLIENT_ID: ${{ secrets.CLUTCH_KICK_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Clutch-AppImage
          path: target/package/*.AppImage
          if-no-files-found: error

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec validate --all --strict

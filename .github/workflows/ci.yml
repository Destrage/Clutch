name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Windows first (primary platform); GPU tests fall back to the WARP software adapter.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg 9 (LGPL, shared)
        shell: pwsh
        run: |
          curl.exe -sSL --fail -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          Expand-Archive ffmpeg.zip -DestinationPath third_party
          Move-Item third_party/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0 third_party/ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser test launches the helper binary, which `cargo test` doesn't build.
      - run: cargo build -p estream-browser
      - run: cargo test --workspace
      - name: Upload golden image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/output/

  rust-linux:
    # GPU tests run on Mesa's software Vulkan (lavapipe).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # No distro libav*-dev: its headers would shadow the bundled FFmpeg 9.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake ninja-build \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig-dev libssl-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev \
            mesa-vulkan-drivers
      - name: FFmpeg 9 (LGPL, shared)
        run: |
          mkdir -p third_party/ffmpeg
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-lgpl-shared-9.0.tar.xz \
            | tar -xJ -C third_party/ffmpeg --strip-components=1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser test launches the helper binary, which `cargo test` doesn't build.
      - run: cargo build -p estream-browser
      - run: cargo test --workspace

  appimage:
    # Built on the oldest supported Ubuntu (PipeWire 1.0, which the bindings need), so the
    # AppImage runs on any newer glibc (2.39+).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev cmake ninja-build \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig-dev libssl-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev
      - name: FFmpeg 9 (LGPL, shared)
        run: |
          mkdir -p third_party/ffmpeg
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-lgpl-shared-9.0.tar.xz \
            | tar -xJ -C third_party/ffmpeg --strip-components=1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: Clutch-AppImage
          path: target/package/*.AppImage
          if-no-files-found: error

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec validate --all --strict
